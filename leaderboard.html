<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Predictions Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ========= THEME (MATCH-CARDS BASE) ========= */
  :root {
    /* Page background */
    --color-bg: #050608;
    --color-bg-radial-top: rgba(255, 215, 130, 0.08);
    --color-bg-radial-bottom: rgba(42, 209, 180, 0.08);

    /* Surfaces */
    --card-bg-main-1: #111318;
    --card-bg-main-2: #0a0b10;
    --card-bg-highlight: rgba(255, 255, 255, 0.04);
    --card-border-soft: rgba(255, 255, 255, 0.04);
    --card-border-strong: rgba(255, 255, 255, 0.18);
    --card-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
    --card-shadow-strong: 0 18px 40px rgba(0, 0, 0, 0.95);

    /* Typography */
    --text-main: #f7f7ff;
    --text-muted: #9ba0bf;
    --text-gold: #ffd782;

    /* Accents */
    --accent: #25d0b4;
    --accent-soft: rgba(37, 208, 180, 0.15);
    --danger: #ff4d6a;
    --success: #3dd68c;
    --warning: #ffb74d;

    /* Team colors */
    --team-a-color: #2ad1b4;
    --team-b-color: #c084fc;

    /* Radii / borders */
    --radius-xl: 22px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-full: 999px;

    --border-soft-2: rgba(255, 255, 255, 0.08);
    --border-strong-2: rgba(255, 255, 255, 0.14);

    --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.7);
    --transition-fast: 180ms ease-out;

    /* Bottom sheet */
    --bg-sheet: #10131a;
    --bg-sheet-elevated: #151923;

    /* Table striping */
    --row-even: rgba(10, 12, 18, 0.82);
    --row-odd: rgba(10, 12, 18, 0.62);

    /* Table header */
    --thead-bg:
      radial-gradient(circle at top, rgba(255,255,255,0.07), transparent 70%),
      rgba(7, 9, 14, 0.96);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 12px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, var(--color-bg-radial-top), transparent 60%),
      radial-gradient(circle at bottom, var(--color-bg-radial-bottom), transparent 55%),
      var(--color-bg);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }

  /* ========= PAGE CARD ========= */
  .page-card {
    max-width: 1024px;
    margin: 0 auto;
    border-radius: var(--radius-xl);
    padding: 12px;
    background:
      radial-gradient(circle at top left, var(--card-bg-highlight), transparent 60%),
      linear-gradient(145deg, var(--card-bg-main-1), var(--card-bg-main-2));
    border: 1px solid var(--card-border-soft);
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }

  .page-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(255,215,130,0.12), transparent 55%);
    opacity: 1;
    pointer-events: none;
    z-index: -1;
  }

  h1 {
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 6px;
  }

  .subtitle {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.35;
  }

  .subtitle b { color: var(--text-gold); font-weight: 650; }

  /* ========= TABLE WRAPPER ========= */
  .table-wrapper {
    border-radius: 18px;
    border: 1px solid var(--border-soft-2);
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 70%),
      rgba(9, 11, 17, 0.96);
    box-shadow: 0 18px 40px rgba(0,0,0,0.65);
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 0.85rem;
    min-width: 640px;
  }

  col.col-rank   { width: 44px; }
  col.col-player { width: 200px; }
  col.col-round  { width: 92px; }
  col.col-total  { width: 92px; }

  thead { background: var(--thead-bg); }

  th, td {
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0 10px;
    height: 48px;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  thead th {
    height: 46px;
    font-weight: 650;
    color: var(--text-muted);
    font-size: 0.72rem;
    text-align: center;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  th:first-child, td:first-child { text-align: center; }
  th:nth-child(2), td:nth-child(2) { text-align: left; }

  tbody tr:nth-child(even) td { background: var(--row-even); }
  tbody tr:nth-child(odd)  td { background: var(--row-odd); }

  /* highlight must be applied to cells */
  tbody tr.highlight-row td {
    background:
      radial-gradient(circle at center, rgba(37,208,180,0.12), transparent 70%),
      rgba(10, 12, 18, 0.72);
    box-shadow:
      inset 0 1px 0 rgba(37,208,180,0.22),
      inset 0 -1px 0 rgba(37,208,180,0.22);
  }

  /* Renamed to avoid collision with your other file's .player-name */
  .lb-player-name {
    font-weight: 750;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* ========= ROUND CELLS / PILLS ========= */
  .round-cell { cursor: pointer; text-align: center; }

  .round-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-full);
    border: 1px solid rgba(255, 255, 255, 0.10);
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 70%),
      rgba(10, 12, 18, 0.95);
    transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast), filter var(--transition-fast);
    max-width: 100%;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
  }

  .round-pill.locked {
    opacity: 0.92;
    letter-spacing: 0.08em;
  }

  .round-pill.live {
    border-color: rgba(255, 183, 77, 0.55);
    color: var(--warning);
    background:
      radial-gradient(circle at top, rgba(255,183,77,0.16), transparent 70%),
      rgba(10, 12, 18, 0.95);
  }

  .round-pill.final {
    border-color: rgba(37, 208, 180, 0.55);
    color: var(--text-gold);
    background:
      radial-gradient(circle at top, rgba(37,208,180,0.16), transparent 70%),
      rgba(10, 12, 18, 0.95);
  }

  .round-cell:hover .round-pill {
    transform: translateY(-1px);
    border-color: rgba(255, 215, 130, 0.55);
    box-shadow: 0 0 0 1px rgba(255, 215, 130, 0.10);
    filter: brightness(1.02);
  }

  .total-cell {
    text-align: center;
    font-weight: 850;
    font-variant-numeric: tabular-nums;
    color: var(--text-gold);
  }

  /* ========= STICKY (rank + player) ========= */
  th:nth-child(1),
  td:nth-child(1) {
    position: sticky;
    left: 0;
    z-index: 3;
    background: inherit; /* critical */
    box-shadow: 1px 0 0 rgba(255,255,255,0.05);
  }

  th:nth-child(2),
  td:nth-child(2) {
    position: sticky;
    left: 44px; /* must match rank col width */
    z-index: 2;
    background: inherit; /* critical */
    box-shadow: 1px 0 0 rgba(255,255,255,0.05);
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--thead-bg);
  }

  /* ========= BOTTOM SHEET (MATCH-CARDS STYLE) ========= */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-fast);
    z-index: 40;
  }
  .sheet-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: -100vh;
    height: 78vh;
    background:
      radial-gradient(circle at top, rgba(255, 255, 255, 0.06), transparent 70%),
      var(--bg-sheet);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    box-shadow: var(--shadow-soft);
    border-top: 1px solid rgba(255, 255, 255, 0.13);
    transition: bottom var(--transition-fast), height var(--transition-fast);
    z-index: 41;
    display: flex;
    justify-content: center;
    pointer-events: none;
    overflow: hidden;
  }
  .sheet.active {
    bottom: 0;
    pointer-events: auto;
  }

  .sheet-inner {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 6px 16px 16px;
    gap: 10px;
  }

  .sheet-handle {
    width: 44px;
    height: 4px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.17);
    margin: 8px auto 4px;
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border-soft-2);
    padding: 6px 2px 10px;
  }

  .sheet-title h2 {
    margin: 0;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    font-weight: 900;
    color: var(--text-main);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 68vw;
  }

  .sheet-close-btn {
    background: rgba(0, 0, 0, 0.35);
    border-radius: var(--radius-full);
    border: 1px solid var(--border-soft-2);
    color: var(--text-main);
    font-size: 18px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: border-color var(--transition-fast), transform var(--transition-fast), filter var(--transition-fast);
    flex: 0 0 auto;
  }
  .sheet-close-btn:hover { border-color: var(--accent); filter: brightness(1.04); }
  .sheet-close-btn:active { transform: scale(0.98); }

  .sheet-content {
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .match-card {
    border-radius: var(--radius-lg);
    background: var(--bg-sheet-elevated);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 10px 10px 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
  }

  .match-head { margin-bottom: 8px; }

    /* ===== Teams header (center VS perfectly) ===== */
    .match-teams{
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    min-width: 0;
    font-weight: 900;
    font-size: 0.86rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    }

    .match-teams .team-a{
    justify-self: start;
    text-align: left;
    color: var(--team-a-color);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    }

    .match-teams .vs{
    justify-self: center;
    }

    .match-teams .team-b{
    justify-self: end;
    text-align: right;
    color: var(--team-b-color);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    }


  /* ===== Prediction row: chips + score pill ===== */
  .pred-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.06);
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 70%),
      rgba(255,255,255,0.02);
  }

  .pred-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .pred-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 0;
  }

  .pred-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: 0.72rem;
    font-weight: 850;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(10, 12, 18, 0.90);
    color: var(--text-muted);
    white-space: nowrap;
    max-width: 100%;
  }

    /* IMP chip base */
    .pred-chip.imp{
    border-color: rgba(255,255,255,0.10);
    background: rgba(10, 12, 18, 0.90);
    font-weight: 950;
    }

    /* Winner A -> teal */
    .pred-chip.imp.imp-a{
    border-color: rgba(42,209,180,0.40);
    color: var(--team-a-color);
    background:
        radial-gradient(circle at top, rgba(42,209,180,0.16), transparent 70%),
        rgba(10, 12, 18, 0.92);
    }

    /* Winner B -> purple */
    .pred-chip.imp.imp-b{
    border-color: rgba(192,132,252,0.40);
    color: var(--team-b-color);
    background:
        radial-gradient(circle at top, rgba(192,132,252,0.16), transparent 70%),
        rgba(10, 12, 18, 0.92);
    }
    /* IMP = 0 (neutral / draw) */
    .pred-chip.imp.imp-zero{
    border-color: rgba(255, 215, 130, 0.45);
    color: var(--text-gold);
    background:
        radial-gradient(circle at top, rgba(255,215,130,0.16), transparent 70%),
        rgba(10, 12, 18, 0.92);
    }


  .pred-right { display: flex; align-items: center; justify-content: flex-end; }

  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: var(--radius-full);
    border: 1px solid rgba(37,208,180,0.35);
    background: rgba(37,208,180,0.10);
    color: var(--text-gold);
    font-weight: 950;
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .score-pill span {
    color: var(--text-muted);
    font-weight: 900;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* Fallback (if you still render old .pred-val text) */
  .pred-val {
    font-size: 0.78rem;
    color: var(--text-muted);
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .summary b { color: var(--text-main); font-weight: 750; }

  @media (max-width: 420px) {
    col.col-player { width: 180px; }
    col.col-round, col.col-total { width: 88px; }
    th, td { padding: 0 8px; }
    table { min-width: 620px; }
  }

  @media (min-width: 900px) {
    body { padding: 16px; }
    .page-card { padding: 14px; }
  }
  @media (max-width: 480px){
    body{ padding: 10px; }

    /* make sheet text easier */
    .sheet-title h2{ font-size: 1.02rem; letter-spacing: 0.01em; }

    .match-teams{ font-size: 0.90rem; }
    .pred-chip{ font-size: 0.78rem; }
    .score-pill{ font-size: 0.82rem; }

    /* table header becomes readable */
    thead th{ font-size: 0.74rem; }

    /* optional: reduce blur a bit for sharper text */
    .sheet-backdrop{ backdrop-filter: blur(3px); }
    }

    .sheet{
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    }


</style>

</head>

<body>
  <div class="page-card">
    <h1>Predictions Leaderboard</h1>
    <div class="subtitle">
      Click a cell to see <b>that user</b> & <b>that round</b>.
    </div>

    <div class="table-wrapper">
      <table id="lb-table">
        <colgroup>
          <col class="col-rank" />
          <col class="col-player" />
          <col class="col-round" />
          <col class="col-round" />
          <col class="col-round" />
          <col class="col-total" />
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>R1</th>
            <th>R2</th>
            <th>R3</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Bottom Sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div class="sheet-title">
          <h2 id="sheet-title">—</h2>
        </div>
        <button class="sheet-close-btn" type="button" id="sheet-close">×</button>
      </div>

      <div class="sheet-content" id="sheet-content"></div>
    </div>
  </div>

  <script type="module">
    import { matchesData, leaderboardUsers, leaderboardPredictions } from "./data.js";

    const roundConfig = [
      { key: "R1", gyros: 1 },
      { key: "R2", gyros: 4 },
      { key: "R3", gyros: 6 },
    ];

    const currentUser = leaderboardUsers.find(u => u.isYou) || leaderboardUsers[0];

    const tbody = document.getElementById("leaderboard-body");
    const sheet = document.getElementById("sheet");
    const backdrop = document.getElementById("sheet-backdrop");
    const sheetTitle = document.getElementById("sheet-title");
    const sheetContent = document.getElementById("sheet-content");

    function getRoundMatches(gyros) {
      return matchesData.filter(m => m.gyros === gyros);
    }

    function getRoundStatus(gyros) {
      const m = matchesData.find(x => x.gyros === gyros);
      return m ? m.status : "not_started";
    }

    function totalsForUser(userId) {
      let total = 0;
      for (const rc of roundConfig) {
        const status = getRoundStatus(rc.gyros);
        if (status !== "final") continue;

        const ms = getRoundMatches(rc.gyros);
        for (const match of ms) {
          const preds = leaderboardPredictions[match.id] || [];
          const p = preds.find(x => x.userId === userId);
          if (p && p.playerVp != null) total += p.playerVp;
        }
      }
      return total;
    }

    function roundTotalForUser(userId, gyros) {
      const status = getRoundStatus(gyros);
      if (status !== "final") return null;

      const matches = getRoundMatches(gyros);
      let sum = 0;

      for (const m of matches) {
        const preds = leaderboardPredictions[m.id] || [];
        const p = preds.find(x => x.userId === userId);
        if (p && p.playerVp != null) sum += p.playerVp;
      }

      return sum;
    }

    function makeRoundPillForCell(user, gyros) {
      const status = getRoundStatus(gyros);
      const isLocked = (status === "not_started" && user.userId !== currentUser.userId);

      if (status === "not_started") return `<span class="round-pill locked">${isLocked ? "🔒" : "👁️"}</span>`;
      if (status === "in_progress") return `<span class="round-pill live">LIVE</span>`;
      const total = roundTotalForUser(user.userId, gyros);
      return `<span class="round-pill final">${total != null ? total.toFixed(2) : "FINAL"}</span>`;
    }

    function renderLeaderboard() {
      tbody.innerHTML = "";

      const rows = [...leaderboardUsers].map(u => ({
        user: u,
        total: totalsForUser(u.userId),
      })).sort((a,b) => b.total - a.total);

      rows.forEach((row, idx) => {
        const u = row.user;
        const tr = document.createElement("tr");
        if (u.isYou) tr.classList.add("highlight-row");

        const tdRank = document.createElement("td");
        tdRank.textContent = String(idx + 1);
        tr.appendChild(tdRank);

        const tdPlayer = document.createElement("td");
        const nm = document.createElement("div");
        nm.className = "lb-player-name";  // renamed (no collision)
        nm.textContent = u.name;
        tdPlayer.appendChild(nm);
        tr.appendChild(tdPlayer);

        for (const rc of roundConfig) {
          const td = document.createElement("td");
          td.className = "round-cell";
          td.innerHTML = makeRoundPillForCell(u, rc.gyros);
          td.addEventListener("click", () => openSheet(u, rc));
          tr.appendChild(td);
        }

        const tdTotal = document.createElement("td");
        tdTotal.className = "total-cell";
        tdTotal.textContent = row.total > 0 ? row.total.toFixed(2) : "—";
        tr.appendChild(tdTotal);

        tbody.appendChild(tr);
      });
    }

    function openSheet(clickedUser, rc) {
      const gyros = rc.gyros;
      const status = getRoundStatus(gyros);
      const isLocked = (status === "not_started" && clickedUser.userId !== currentUser.userId);

      sheetTitle.textContent = `${clickedUser.name} · ${rc.key}`;
      const roundScore = roundTotalForUser(clickedUser.userId, gyros);
      if (roundScore != null) sheetTitle.textContent += ` · ${roundScore.toFixed(2)}`;

      sheetContent.innerHTML = "";
      const matches = getRoundMatches(gyros);

      for (const m of matches) {
        const card = document.createElement("div");
        card.className = "match-card";

        const head = document.createElement("div");
        head.className = "match-head";

        const teams = document.createElement("div");
        teams.className = "match-teams";
        teams.innerHTML = `
        <span class="team-a">${m.t1_name}</span>
        <span class="vs">VS</span>
        <span class="team-b">${m.t2_name}</span>
        `;


        head.appendChild(teams);
        card.appendChild(head);

        if (isLocked) {
          const lock = document.createElement("div");
          lock.className = "summary";
          lock.textContent = "Locked until the round goes live.";
          card.appendChild(lock);
          sheetContent.appendChild(card);
          continue;
        }

        const preds = leaderboardPredictions[m.id] || [];
        const p = preds.find(x => x.userId === clickedUser.userId);

        if (!p) {
          const none = document.createElement("div");
          none.className = "summary";
          none.textContent = "No prediction found for this user.";
          card.appendChild(none);
          sheetContent.appendChild(card);
          continue;
        }

        const row = document.createElement("div");
        row.className = "pred-row";

        const left = document.createElement("div");
        left.className = "pred-left";

        const diff = p.prediction.diffImp;
        const winnerIsA = (p.prediction.winner === "A");


        // chips container
        const chips = document.createElement("div");
        chips.className = "pred-chips";

        // IMP chip (this is the only chip)
        const impChip = document.createElement("span");

        if (diff === 0) {
        impChip.className = "pred-chip imp imp-zero";
        } else {
        impChip.className = "pred-chip imp " + (winnerIsA ? "imp-a" : "imp-b");
        }

        impChip.textContent = `${diff >= 0 ? "+" : ""}${diff} IMP`;


        chips.appendChild(impChip);
        left.appendChild(chips);


        // score pill (right side)
        const scorePill = document.createElement("div");
        scorePill.className = "score-pill";
        scorePill.innerHTML = `<span>Score</span> ${p.playerVp != null ? p.playerVp.toFixed(2) : "—"}`;

        const right = document.createElement("div");
        right.className = "pred-right";
        right.appendChild(scorePill);

        row.appendChild(left);
        row.appendChild(right);
        card.appendChild(row);

        sheetContent.appendChild(card);
      }

      backdrop.classList.add("active");
      sheet.classList.add("active");
    }

    function closeSheet() {
      backdrop.classList.remove("active");
      sheet.classList.remove("active");
    }

    backdrop.addEventListener("click", closeSheet);
    document.getElementById("sheet-close").addEventListener("click", closeSheet);

    renderLeaderboard();
  </script>
</body>
</html>
